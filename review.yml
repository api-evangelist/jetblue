actions:
  apisYmlApis: []
  openapiHarvested: []
  reason: |
    No public API, no developer portal, and no downloadable OpenAPI, AsyncAPI
    or NDC schema were found for JetBlue. The NDC contract exists but is
    supplied only to partners who have submitted a business use case and
    passed JetBlue certification testing, and the ticketing channel behind it
    requires ARC or IATA/BSP accreditation. apis[] is intentionally empty and
    openapi/ was not created. This is an honest identity-only (built-stub)
    profile of a fully gated, GDS-intermediated airline with a live but
    unpublished NDC program.
