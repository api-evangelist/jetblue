  duplicateCandidate:
    slug: jetblue-airways
    note: >-
      The APIs.io catalog already carries a thin record at slug
      "jetblue-airways" (created 2026-03-21, 0 APIs, composite 4.9, band
      minimal). This richer "jetblue" record should be reconciled against it
      under the duplicate-provider-retirement process — survivor plus
      retired.yml tombstone — rather than left as a parallel listing.
  imageAsset: >-
    apis.yml uses the shared apis-json placeholder logo. No jetblue.png exists
    yet at kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ (HTTP 403);
    the provider-icons backfill should replace it.
