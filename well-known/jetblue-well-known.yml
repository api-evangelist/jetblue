generated: '2026-07-28'
method: searched
source: live probes of every JetBlue host named in apis.yml and in the JetBlue Vulnerability Disclosure Policy scope
note: >-
  The only /.well-known/ documents JetBlue serves anonymously are the OpenID
  Connect discovery document and the RFC 8414 OAuth 2.0 authorization server
  metadata on accounts.jetblue.com — the Okta-hosted identity provider behind
  jetblue.com sign-in and the TrueBlue account. They are real, fetched
  verbatim, and are the only machine-readable API contract JetBlue publishes.
  They describe the consumer identity surface, NOT a partner or NDC API:
  JetBlue publishes no developer portal, no API reference and no OpenAPI. No
  security.txt is served on any host, even though JetBlue runs a HackerOne
  vulnerability disclosure program.
