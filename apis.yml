name: JetBlue
kind: company
description: >-
  JetBlue Airways (IATA code B6) is a New York-headquartered low-cost United
  States carrier flying across the U.S., Caribbean, Latin America and Europe,
  with hubs and focus cities at JFK, Boston, Fort Lauderdale, Orlando and San
  Juan. In the travel distribution chain JetBlue sits as an inventory owner
  that sells through three channels: its own direct consumer surface
  (jetblue.com, the JetBlue app and the TrueBlue loyalty program), the legacy
  GDS channel where it files fares, seats and EMDs and settles through ARC in
  the U.S. and IATA BSPs internationally, and an IATA New Distribution
  Capability program that reaches agencies through GDS/NDC aggregators,
  corporate booking tools and online booking platforms. JetBlue publishes no
  public developer portal, no API reference and no downloadable OpenAPI or
  NDC schema: developer.jetblue.com, developers.jetblue.com and
  docs.jetblue.com do not resolve, api.jetblue.com answers 404 at every probed
  path, and the 361-URL public sitemap contains no developer or API page. The
  only published distribution surface is the travel-agent policy section at
  jetblue.com/travel-agents, including an NDC program page that states
  JetBlue supplies NDC API documentation, schema and message samples and
  certification guidelines to onboarded partners only, after business use-case
  submission, onboarding and certification testing. Selling JetBlue requires
  ARC accreditation in the U.S. or IATA accreditation plus local BSP
  participation abroad; JetBlue states it works with only a few OTAs and is
  not accepting new applications. Public docs, accreditation required, no
  self-serve access, and no exit path.
